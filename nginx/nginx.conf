events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for faster web delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Upstream pointing to internal FastAPI container service
    upstream plant_detector_backend {
        server plant-disease-detector:8000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25M;

        # Reverse proxy to FastAPI application
        location / {
            proxy_pass http://plant_detector_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Health endpoint passthrough
        location /health {
            proxy_pass http://plant_detector_backend/health;
            access_log off;
        }
    }
}

