apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plant-disease-detector-ingress
  namespace: plant-disease-detector
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  rules:
    - host: plant-detector.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plant-disease-detector-service
                port:
                  number: 80

